<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routine</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="view on" id="v-today"></section>
<section class="view" id="v-stats"></section>
<section class="view" id="v-settings"></section>

<nav><div class="inner">
  <button class="on" data-act="nav" data-view="today"><span class="ic">📅</span>Heute</button>
  <button data-act="nav" data-view="stats"><span class="ic">📊</span>Statistik</button>
  <button data-act="nav" data-view="settings"><span class="ic">⚙️</span>Einstellungen</button>
</div></nav>

<div class="sheet-bg" id="sheetBg" data-act="sheet-close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><b id="sheetTitle"></b><button class="iconbtn" data-act="sheet-close" aria-label="Schließen">✕</button></div>
  <div class="restbar" id="restBar"><div class="rb-fill" id="rbFill"></div><span class="rb-time" id="rbTime"></span><span class="rb-label" id="rbLabel"></span><button data-act="rest-plus">+15 s</button><button data-act="rest-stop">Stopp</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
