<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routine</title>
<meta name="theme-color" content="#FBF6EA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app"></main>

<nav><div class="inner">
  <button class="on" data-act="nav" data-view="home"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Heute</span></button>
  <button data-act="nav" data-view="calendar"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Kalender</span></button>
  <button data-act="nav" data-view="settings"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Einstellungen</span></button>
</div></nav>

<div class="sheet-bg" id="sheetBg" data-act="sheet-close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><b id="sheetTitle"></b><button class="iconbtn sm" data-act="sheet-close" aria-label="Schließen"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
  <div class="restbar" id="restBar"><div class="rb-fill" id="rbFill"></div><span class="rb-time" id="rbTime"></span><span class="rb-label" id="rbLabel"></span><button data-act="rest-plus">+15 s</button><button data-act="rest-stop">Stopp</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
